name: release

# Publishes to PyPI on version tags using the PYPI_USERNAME /
# PYPI_PASSWORD repository secrets (an API token: username __token__).
# `git tag v0.1.0 && git push --tags` publishes.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_PASSWORD }}
